server {
    listen 80;
    server_name logan-brunet.fr www.logan-brunet.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}

server {
    listen 443 ssl;
    server_name logan-brunet.fr www.logan-brunet.fr;

    ssl_certificate /etc/letsencrypt/live/logan-brunet.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logan-brunet.fr/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
}